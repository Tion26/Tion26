<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ถึงเธอ ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Prompt',sans-serif;
}

body{
    overflow:hidden;
    background:linear-gradient(135deg,#ffd6e7,#ffffff);
}

.page{
    width:100vw;
    height:100vh;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    position:relative;
}

.page.active{
    display:flex;
}

img{
    width:85%;
    max-width:350px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(255,105,180,.4);
}

h1{
    color:#ff4f8b;
    margin:20px 0;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:50px;
    background:#ff4f8b;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-top:20px;
}

button:hover{
    transform:scale(1.05);
}

.heart{
    position:fixed;
    bottom:-20px;
    color:#ff6aa2;
    animation:float 8s linear infinite;
    z-index:-1;
}

@keyframes float{
    from{
        transform:translateY(0) rotate(0deg);
        opacity:1;
    }
    to{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}

.slider{
    width:85%;
    max-width:350px;
    height:450px;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(255,105,180,.4);
}

.slider img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.counter{
    margin-top:20px;
    color:#ff4f8b;
    font-size:20px;
    line-height:1.8;
}

.love-text{
    max-width:600px;
    color:#444;
    font-size:18px;
    line-height:1.8;
    margin-bottom:20px;
}
</style>
</head>
<body>

<!-- หน้า 1 -->
<div class="page active" id="page1">
    <img src="file:///C:/Users/MEECHAI/Downloads/A84D11E4-A398-4EE2-948E-E2E450F63E65.jpeg" alt="">
    <h1>ถึงเธอ ❤️</h1>
    <button onclick="nextPage(2)">เริ่มต้น</button>
</div>

<!-- หน้า 2 -->
<div class="page" id="page2">
    <h1>ตอนเธอยิ้ม 📸</h1>

    <div class="slider">
        <img id="slideImage" src="file:///C:/Users/MEECHAI/Downloads/1830C80E-6F2B-4244-AF39-6778170978A0.jpeg">
    </div>

    <button onclick="nextPage(3)">อ่านข้อความลับ</button>
</div>

<!-- หน้า 3 -->
<div class="page" id="page3">
    <h1>ข้อความลับ 💌</h1>

    <div class="love-text">
        ขอบคุณที่เข้ามาในชีวิตของเค้านะ ❤️<br><br>

        ถึงจะเป็นเวลาสั้นๆ แต่เค้าก็ตั้งใจรักเธอจริงๆ นะ
        ขอบคุณเธอเป็นเซฟโซนให้กับเค้า

        ไม่ว่าจะมีปัญหาหรือเราทะเลาะกันแค่ไหน
        หวังว่าเธอกับเค้าจะผ่านมันไปด้วยกัน สุดท้ายแล้วเค้ามาง้อนะแฟน

        
        รักแฟนมากๆนะ ❤️
    </div>

    <div class="counter" id="counter"></div>
</div>

<script>

// เปลี่ยนหน้า
function nextPage(page){
    document.querySelectorAll('.page').forEach(p=>{
        p.classList.remove('active');
    });

    document.getElementById('page'+page).classList.add('active');
}

// สไลด์รูป
const images = [
    "file:///C:/Users/MEECHAI/Downloads/1830C80E-6F2B-4244-AF39-6778170978A0.jpeg",
    "file:///C:/Users/MEECHAI/Downloads/1830C80E-6F2B-4244-AF39-6778170978A0.jpeg"
];

let current = 0;

setInterval(()=>{
    current = (current + 1) % images.length;
    document.getElementById("slideImage").src = images[current];
},3000);

// วันเริ่มคบ
const startDate = new Date("2026-05-17T00:00:00");

function updateCounter(){

    const now = new Date();

    let years = now.getFullYear() - startDate.getFullYear();
    let months = now.getMonth() - startDate.getMonth();
    let days = now.getDate() - startDate.getDate();

    if(days < 0){
        months--;
        const prevMonth = new Date(
            now.getFullYear(),
            now.getMonth(),
            0
        ).getDate();
        days += prevMonth;
    }

    if(months < 0){
        years--;
        months += 12;
    }

    const diff = now - startDate;

    const hours = Math.floor(diff/(1000*60*60))%24;
    const minutes = Math.floor(diff/(1000*60))%60;
    const seconds = Math.floor(diff/1000)%60;

    document.getElementById("counter").innerHTML = `
        ❤️ เวลาของเรา ❤️<br><br>

        ${years} ปี<br>
        ${months} เดือน<br>
        ${days} วัน<br>
        ${hours} ชั่วโมง<br>
        ${minutes} นาที<br>
        ${seconds} วินาที
    `;
}

updateCounter();
setInterval(updateCounter,1000);

// หัวใจลอย
function createHeart(){

    const heart = document.createElement("div");

    heart.classList.add("heart");
    heart.innerHTML = "❤️";

    heart.style.left = Math.random()*100+"vw";
    heart.style.fontSize = (Math.random()*20+15)+"px";
    heart.style.animationDuration =
        (Math.random()*5+5)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },10000);
}

setInterval(createHeart,300);

</script>

</body>
</html>
